<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./stylesModal.css">
</head>
<body>

<div class="container text-center mt-5">
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#authModal" data-bs-title="INICIA SESIÓN">Iniciar Sesión</button>
    <span id="userDisplay" class="ms-3 fw-bold"></span>
</div>

<div class="modal fade" id="authModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header border-0">
                <h2 class="fw-bold" id="authModalTitle">INICIA SESIÓN O REGÍSTRATE</h2>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-4">Accede a diseños exclusivos, experiencias y ofertas.</p>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="userName">
                        <div id="nameAlert" class="alert alert-danger d-none" role="alert"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="text" class="form-control" id="userEmail">
                        <div id="emailAlert" class="alert alert-danger d-none" role="alert"></div>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="termsCheck">
                        <label class="form-check-label">Acepto términos y condiciones</label>
                        <div id="termsAlert" class="alert alert-danger d-none" role="alert"></div>
                    </div>
                    <button type="submit" class="btn btn-light w-100">CONTINUAR</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="./javascript/modal.js"></script>
</body>
</html>
